# Temporary, Catan-only certificate challenge site. No game is exposed.
server {
    listen 80;
    server_name catan.magical-athlete-online.cn;
    if ($host != "catan.magical-athlete-online.cn") { return 421; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/catan-friends-acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
