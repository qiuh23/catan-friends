/var/log/catan-friends/app.log /var/log/catan-friends/nginx-error.log {
    daily
    maxsize 10M
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root adm
}
# copytruncate can lose a small number of concurrent log lines. It avoids
# restarting a live game. This policy is not used for audit/security evidence.
