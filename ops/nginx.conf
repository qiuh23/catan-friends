# Reviewed template only: bootstrap does not enable this site or request a cert.
# Install this independently of the athlete, wizard and preview virtual hosts.
limit_req_zone $binary_remote_addr zone=catan_api:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=catan_connections:1m;
map $http_upgrade $catan_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name catan.magical-athlete-online.cn;
    if ($host != "catan.magical-athlete-online.cn") { return 421; }
    access_log off; # Domestic site: no access/connection security audit.
    error_log /var/log/catan-friends/nginx-error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/catan-friends-acme;
        try_files $uri =404;
    }
    location / { return 308 https://catan.magical-athlete-online.cn$request_uri; }
}
server {
    listen 443 ssl;
    server_name catan.magical-athlete-online.cn;
    if ($host != "catan.magical-athlete-online.cn") { return 421; }
    ssl_certificate /etc/letsencrypt/live/catan.magical-athlete-online.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catan.magical-athlete-online.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16k;
    access_log off; # Domestic site: no access/connection security audit.
    error_log /var/log/catan-friends/nginx-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / {
        limit_conn catan_connections 30;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $catan_connection_upgrade;
        # Replace client-supplied headers. Node trusts only the loopback peer.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
        proxy_buffering off;
    }
    location /api/ {
        limit_req zone=catan_api burst=20 nodelay;
        limit_conn catan_connections 30;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $catan_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
        proxy_buffering off;
    }
}
