name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catan-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check deployment provenance, backend isolation and networking
        run: node --test tests/deploy-release.test.js tests/network.test.js tests/integration-policy.test.js tests/site-policy.test.js tests/asset-cache.test.js tests/model-loading.test.js
      - run: npm run build
      - run: npm run worker:check
      # Full browser/gameplay acceptance runs locally; no cloud credentials here.
      - name: Package the exact checked Linux source and prebuilt Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/deploy/package.sh "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RUNNER_TEMP/catan-artifacts"
      - name: Save checked Catan-only Node bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-${{ github.sha }}
          path: ${{ runner.temp }}/catan-artifacts/node/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      - name: Save checked Catan-only Worker and assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-${{ github.sha }}
          path: ${{ runner.temp }}/catan-artifacts/worker/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
